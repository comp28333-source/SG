<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Таблиця позивних і кодів — БЛiК</title>
<style>
  :root {
    --bg-color: #1e2024;
    --text-color: #e2e6ec;
    --text-muted: #9aa2b1;
    --accent-color: #3b82f6;
    --success-color: #22c55e;
    --danger-color: #ef4444;
    --warn-color: #f59e0b;
    --depth: 6px;
    --radius: 14px;
    --font-size: 14px;
    --shadow-light: rgba(255, 255, 255, 0.05);
    --shadow-dark: rgba(0, 0, 0, 0.55);
    --border-subtle: rgba(255, 255, 255, 0.05);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    background-color: var(--bg-color);
    color: var(--text-color);
    font-size: var(--font-size);
    min-height: 100vh;
    padding: 20px 16px 56px;
    transition: background-color 0.25s ease, color 0.25s ease;
  }

  .container {
    max-width: 1160px;
    margin: 0 auto;
    display: none;
  }

  .neu-extruded {
    background-color: var(--bg-color);
    border-radius: var(--radius);
    box-shadow:
      calc(var(--depth) * -1) calc(var(--depth) * -1) calc(var(--depth) * 2) var(--shadow-light),
      var(--depth) var(--depth) calc(var(--depth) * 2) var(--shadow-dark);
    border: 1px solid var(--border-subtle);
    transition: all 0.2s ease;
  }

  .neu-pressed {
    background-color: var(--bg-color);
    border-radius: var(--radius);
    box-shadow:
      inset calc(var(--depth) * -0.7) calc(var(--depth) * -0.7) calc(var(--depth) * 1.4) var(--shadow-light),
      inset calc(var(--depth) * 0.7) calc(var(--depth) * 0.7) calc(var(--depth) * 1.4) var(--shadow-dark);
    border: 1px solid var(--border-subtle);
    transition: all 0.2s ease;
  }

  .neu-btn {
    background-color: var(--bg-color);
    color: var(--text-color);
    border-radius: calc(var(--radius) * 0.75);
    border: 1px solid var(--border-subtle);
    box-shadow:
      calc(var(--depth) * -0.6) calc(var(--depth) * -0.6) calc(var(--depth) * 1.2) var(--shadow-light),
      calc(var(--depth) * 0.6) calc(var(--depth) * 0.6) calc(var(--depth) * 1.2) var(--shadow-dark);
    cursor: pointer;
    padding: 9px 14px;
    font-weight: 600;
    font-size: 0.92em;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s ease;
    user-select: none;
    white-space: nowrap;
    outline: none;
  }

  .neu-btn:focus-visible {
    border-color: var(--accent-color);
  }

  .neu-btn:hover {
    color: var(--accent-color);
  }

  .neu-btn:active, .neu-btn.active {
    box-shadow:
      inset calc(var(--depth) * -0.5) calc(var(--depth) * -0.5) var(--depth) var(--shadow-light),
      inset calc(var(--depth) * 0.5) calc(var(--depth) * 0.5) var(--depth) var(--shadow-dark);
    color: var(--accent-color);
  }

  .neu-btn.success-btn {
    color: var(--success-color);
  }

  .neu-btn.danger-btn {
    color: var(--danger-color);
  }

  .neu-btn.key-protected {
    color: var(--warn-color);
    border-color: rgba(245, 158, 11, 0.35);
  }

  /* Екран блокування всього застосунку */
  .app-lock-screen {
    display: none;
    min-height: calc(100vh - 76px);
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .app-lock-screen.open {
    display: flex;
    animation: fadeIn 0.22s ease;
  }

  .app-lock-card {
    width: 100%;
    max-width: 410px;
    padding: 28px 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    text-align: center;
  }

  .app-lock-icon {
    font-size: 2.6em;
    line-height: 1;
  }

  .app-lock-title {
    font-size: 1.22em;
    font-weight: 800;
    color: var(--accent-color);
    letter-spacing: 0.4px;
  }

  .app-lock-sub {
    font-size: 0.9em;
    color: var(--text-muted);
  }

  .app-lock-reset {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 0.8em;
    cursor: pointer;
    text-decoration: underline;
    opacity: 0.7;
    margin-top: 4px;
  }

  .app-lock-reset:hover {
    color: var(--danger-color);
    opacity: 1;
  }

  /* Header */
  header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    margin-bottom: 16px;
  }

  .sig-badge {
    padding: 8px 15px;
    font-weight: 800;
    font-size: 1.15em;
    letter-spacing: 1px;
    color: var(--accent-color);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .sig-badge small {
    font-size: 0.68em;
    opacity: 0.68;
    font-weight: 600;
  }

  .header-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  .search-box {
    position: relative;
    flex: 1;
    min-width: 210px;
    max-width: 320px;
    display: flex;
    align-items: center;
  }

  .search-input {
    width: 100%;
    padding: 10px 34px 10px 14px;
    border: none;
    outline: none;
    color: var(--text-color);
    font-size: 0.95em;
    background: transparent;
  }

  .search-input::placeholder {
    color: var(--text-muted);
  }

  .search-clear {
    position: absolute;
    right: 10px;
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 14px;
    display: none;
    padding: 2px 5px;
  }

  .search-clear.visible {
    display: block;
  }

  /* Editor Toolbar */
  .editor-toolbar {
    display: none;
    padding: 14px 18px;
    margin-bottom: 16px;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    border: 1px solid rgba(59, 130, 246, 0.35);
  }

  .editor-toolbar.open {
    display: flex;
    animation: fadeIn 0.2s ease;
  }

  .editor-toolbar-group {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }

  /* Filter Pills */
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }

  .cat-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    align-items: center;
  }

  .filter-right-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    align-items: center;
  }

  .pill-btn {
    padding: 6px 12px;
    font-size: 0.8em;
    font-weight: 700;
    letter-spacing: 0.4px;
    border-radius: 99px;
  }

  .pill-btn.fav-pill.active {
    color: var(--warn-color);
  }

  /* Composer */
  .composer-panel {
    display: none;
    padding: 14px 18px;
    margin-bottom: 16px;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  .composer-panel.open {
    display: flex;
    animation: fadeIn 0.2s ease;
  }

  .composer-input {
    flex: 1;
    min-width: 200px;
    padding: 10px 14px;
    border: none;
    outline: none;
    color: var(--text-color);
    font-size: 1em;
    font-weight: 600;
  }

  /* Quiz */
  .quiz-panel {
    display: none;
    padding: 20px;
    margin-bottom: 18px;
    flex-direction: column;
    gap: 14px;
  }

  .quiz-panel.open {
    display: flex;
    animation: fadeIn 0.2s ease;
  }

  .quiz-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }

  .quiz-question {
    font-size: 1.12em;
    font-weight: 700;
    padding: 14px 16px;
    text-align: center;
  }

  .quiz-question span {
    color: var(--accent-color);
  }

  .quiz-options {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 10px;
  }

  .quiz-opt {
    justify-content: center;
    text-align: center;
    padding: 12px 14px;
    white-space: normal;
  }

  .quiz-opt.correct {
    color: var(--success-color) !important;
    border-color: var(--success-color);
  }

  .quiz-opt.wrong {
    color: var(--danger-color) !important;
    border-color: var(--danger-color);
  }

  /* Settings Panel */
  .settings-panel {
    display: none;
    padding: 20px;
    margin-bottom: 20px;
    flex-direction: column;
    gap: 18px;
  }

  .settings-panel.open {
    display: flex;
    animation: fadeIn 0.2s ease;
  }

  .settings-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(195px, 1fr));
    gap: 16px;
  }

  .setting-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .setting-group label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-muted);
    font-weight: 700;
  }

  .theme-presets {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .preset-dot {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid var(--border-subtle);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    transition: transform 0.15s;
  }

  .preset-dot:hover {
    transform: scale(1.12);
  }

  input[type="color"] {
    -webkit-appearance: none;
    border: none;
    width: 100%;
    height: 36px;
    border-radius: 8px;
    cursor: pointer;
    background: transparent;
  }

  input[type="range"] {
    width: 100%;
    accent-color: var(--accent-color);
    cursor: pointer;
  }

  .settings-footer-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: space-between;
    border-top: 1px solid var(--border-subtle);
    padding-top: 14px;
  }

  /* Category Cards */
  .categories-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 20px;
    align-items: start;
  }

  .category-card {
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .category-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border-subtle);
  }

  .category-card.collapsed .category-header {
    border-bottom: none;
    padding-bottom: 0;
  }

  .category-card.collapsed .category-body {
    display: none;
  }

  .category-title-click {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    flex: 1;
    min-width: 0;
    user-select: none;
  }

  .category-title {
    font-size: 1.06em;
    font-weight: 800;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--accent-color);
    word-break: break-word;
  }

  .category-count {
    font-size: 0.78em;
    padding: 3px 9px;
    border-radius: 20px;
    color: var(--text-muted);
    font-weight: 700;
    flex-shrink: 0;
  }

  .cat-header-controls {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
  }

  .icon-btn {
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-muted);
    cursor: pointer;
    border-radius: 8px;
    width: 28px;
    height: 28px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.95em;
    transition: all 0.15s;
  }

  .icon-btn:hover {
    color: var(--accent-color);
    background: rgba(255, 255, 255, 0.04);
    border-color: var(--border-subtle);
  }

  .icon-btn.del:hover {
    color: var(--danger-color);
  }

  .icon-btn.lock-active {
    color: var(--warn-color);
  }

  .icon-btn.unlock-active {
    color: var(--success-color);
  }

  .toggle-block-btn {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background-color: var(--bg-color);
    color: var(--accent-color);
    border: 1px solid var(--border-subtle);
    box-shadow:
      calc(var(--depth) * -0.45) calc(var(--depth) * -0.45) calc(var(--depth) * 0.9) var(--shadow-light),
      calc(var(--depth) * 0.45) calc(var(--depth) * 0.45) calc(var(--depth) * 0.9) var(--shadow-dark);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.78em;
    line-height: 1;
    transition: all 0.15s ease;
    user-select: none;
  }

  .toggle-block-btn:hover {
    transform: scale(1.06);
  }

  .category-card.collapsed .toggle-block-btn {
    box-shadow:
      inset calc(var(--depth) * -0.35) calc(var(--depth) * -0.35) calc(var(--depth) * 0.7) var(--shadow-light),
      inset calc(var(--depth) * 0.35) calc(var(--depth) * 0.35) calc(var(--depth) * 0.7) var(--shadow-dark);
  }

  .edit-only {
    display: none;
  }

  body.edit-mode .edit-only {
    display: inline-flex;
  }

  /* Locked block view */
  .locked-box {
    padding: 22px 14px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    color: var(--text-muted);
  }

  .locked-box .lock-big {
    font-size: 1.8em;
  }

  /* Table inside cards */
  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0 8px;
  }

  tr.code-row {
    transition: transform 0.12s ease;
    cursor: pointer;
  }

  tr.code-row:hover {
    transform: translateY(-1px);
  }

  td {
    padding: 10px 10px;
    font-size: 0.95em;
    vertical-align: middle;
  }

  td.code-cell {
    font-weight: 700;
    color: var(--accent-color);
    white-space: nowrap;
    width: 35%;
    border-top-left-radius: calc(var(--radius) * 0.65);
    border-bottom-left-radius: calc(var(--radius) * 0.65);
  }

  td.desc-cell {
    color: var(--text-color);
  }

  td.actions-cell {
    width: 1%;
    white-space: nowrap;
    text-align: right;
    border-top-right-radius: calc(var(--radius) * 0.65);
    border-bottom-right-radius: calc(var(--radius) * 0.65);
  }

  .row-bg td {
    background-color: var(--bg-color);
    box-shadow:
      inset calc(var(--depth) * -0.4) calc(var(--depth) * -0.4) calc(var(--depth) * 0.8) var(--shadow-light),
      inset calc(var(--depth) * 0.4) calc(var(--depth) * 0.4) calc(var(--depth) * 0.8) var(--shadow-dark);
  }

  .row-action-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 1em;
    padding: 2px 4px;
    transition: color 0.15s, transform 0.1s;
  }

  .row-action-btn:hover {
    color: var(--warn-color);
    transform: scale(1.15);
  }

  .row-action-btn.is-fav {
    color: var(--warn-color);
  }

  .row-action-btn.edit-row-btn:hover {
    color: var(--accent-color);
  }

  .row-action-btn.del-row-btn:hover {
    color: var(--danger-color);
  }

  body.hide-descs .desc-text {
    filter: blur(5px);
    transition: filter 0.2s;
  }

  body.hide-descs tr.code-row:hover .desc-text,
  body.hide-descs tr.code-row.revealed .desc-text {
    filter: none;
  }

  mark.hl {
    background: rgba(59, 130, 246, 0.28);
    color: inherit;
    border-radius: 3px;
    padding: 0 2px;
  }

  .empty-state {
    grid-column: 1 / -1;
    padding: 38px 20px;
    text-align: center;
    color: var(--text-muted);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  /* Custom Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(3px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 2000;
  }

  .modal-backdrop.open {
    display: flex;
    animation: fadeIn 0.18s ease;
  }

  .modal-card {
    width: 100%;
    max-width: 480px;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-height: 92vh;
    overflow-y: auto;
  }

  .modal-title {
    font-size: 1.1em;
    font-weight: 800;
    color: var(--accent-color);
  }

  .modal-note {
    font-size: 0.85em;
    color: var(--text-muted);
    line-height: 1.45;
    padding: 9px 12px;
  }

  .modal-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    text-align: left;
  }

  .modal-field label {
    font-size: 0.78em;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .pass-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }

  .modal-input {
    width: 100%;
    padding: 10px 14px;
    border: none;
    outline: none;
    color: var(--text-color);
    font-size: 0.95em;
    background-color: var(--bg-color);
  }

  textarea.modal-input {
    resize: vertical;
    font-family: Consolas, Monaco, monospace;
    font-size: 0.82em;
    line-height: 1.4;
  }

  .pass-wrap .modal-input {
    padding-right: 38px;
  }

  .pass-eye {
    position: absolute;
    right: 10px;
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 1em;
  }

  .modal-hint {
    font-size: 0.85em;
    min-height: 18px;
    color: var(--text-muted);
  }

  .modal-hint.ok {
    color: var(--success-color);
  }

  .modal-hint.err {
    color: var(--danger-color);
  }

  .modal-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 4px;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    padding: 10px 20px;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent-color);
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s ease;
    z-index: 2500;
    max-width: 90vw;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  .watermark {
    position: fixed;
    bottom: 12px;
    right: 16px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    opacity: 0.45;
    pointer-events: none;
    user-select: none;
    z-index: 999;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 600px) {
    .categories-grid { grid-template-columns: 1fr; }
    header { padding: 14px 16px; }
    .search-box { max-width: 100%; }
  }
</style>
</head>
<body>

<!-- Екран блокування всього застосунку -->
<div class="app-lock-screen" id="appLockScreen">
  <div class="app-lock-card neu-extruded">
    <div class="app-lock-icon">🔑</div>
    <div class="app-lock-title">Доступ обмежено</div>
    <div class="app-lock-sub">Введіть пароль застосунку для перегляду сигналів</div>

    <div class="modal-field">
      <div class="pass-wrap">
        <input type="password" id="appUnlockInput" class="modal-input neu-pressed" placeholder="Введіть пароль..." autocomplete="current-password">
        <button type="button" class="pass-eye" id="appUnlockEye" title="Показати/приховати">👁️</button>
      </div>
    </div>

    <div class="modal-hint" id="appUnlockHint"></div>

    <button type="button" class="neu-btn success-btn" id="appUnlockSubmit" style="justify-content:center; padding:11px 18px;">
      🔓 Розблокувати застосунок
    </button>

    <button type="button" class="app-lock-reset" id="appLockResetBtn">Скинути пароль і дані (якщо забули пароль)</button>
  </div>
</div>

<!-- Основний контейнер застосунку -->
<div class="container" id="appContainer">
  <header class="neu-extruded">
    <div class="sig-badge neu-pressed" id="sigBadge" title="Натисніть, щоб змінити СИГНАЛ">
      <span id="sigText">СИГ: 47 &nbsp;|&nbsp; 160</span>
      <small>✎</small>

  // ==========================================
  // Криптографія (SHA-256 + потокове шифрування)
  // ==========================================
  function sha256(str) {
    const bytes = new TextEncoder().encode(str);
    const K = [
      0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
      0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
      0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
      0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
      0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
      0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
      0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
      0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
    ];
    const H = [
      0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,
      0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19
    ];
    const bitLen = bytes.length * 8;
    const padLen = ((bytes.length + 9 + 63) >> 6) << 6;
    const padded = new Uint8Array(padLen);
    padded.set(bytes);
    padded[bytes.length] = 0x80;
    const view = new DataView(padded.buffer);
    view.setUint32(padLen - 8, Math.floor(bitLen / 0x100000000), false);
    view.setUint32(padLen - 4, bitLen >>> 0, false);

    const rotr = (x, n) => (x >>> n) | (x << (32 - n));
    const w = new Uint32Array(64);

    for (let i = 0; i < padLen; i += 64) {
      for (let t = 0; t < 16; t++) w[t] = view.getUint32(i + t * 4, false);
      for (let t = 16; t < 64; t++) {
        const s0 = rotr(w[t - 15], 7) ^ rotr(w[t - 15], 18) ^ (w[t - 15] >>> 3);
        const s1 = rotr(w[t - 2], 17) ^ rotr(w[t - 2], 19) ^ (w[t - 2] >>> 10);
        w[t] = (w[t - 16] + s0 + w[t - 7] + s1) >>> 0;
      }
      let [a, b, c, d, e, f, g, h] = H;
      for (let t = 0; t < 64; t++) {
        const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
        const ch = (e & f) ^ (~e & g);
        const temp1 = (h + S1 + ch + K[t] + w[t]) >>> 0;
        const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
        const maj = (a & b) ^ (a & c) ^ (b & c);
        const temp2 = (S0 + maj) >>> 0;
        h = g; g = f; f = e; e = (d + temp1) >>> 0;
        d = c; c = b; b = a; a = (temp1 + temp2) >>> 0;
      }
      H[0] = (H[0] + a) >>> 0; H[1] = (H[1] + b) >>> 0;
      H[2] = (H[2] + c) >>> 0; H[3] = (H[3] + d) >>> 0;
      H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0;
      H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0;
    }
    return H.map(x => x.toString(16).padStart(8, "0")).join("");
  }

  function randomSalt() {
    const arr = new Uint8Array(8);
    if (window.crypto && crypto.getRandomValues) {
      crypto.getRandomValues(arr);
    } else {
      for (let i = 0; i < arr.length; i++) arr[i] = Math.floor(Math.random() * 256);
    }
    return Array.from(arr, b => b.toString(16).padStart(2, "0")).join("");
  }

  function xorStream(bytes, password, salt) {
    const out = new Uint8Array(bytes.length);
    for (let offset = 0, counter = 0; offset < bytes.length; offset += 32, counter++) {
      const keyHex = sha256(`${password}|${salt}|stream|${counter}`);
      const limit = Math.min(32, bytes.length - offset);
      for (let j = 0; j < limit; j++) {
        out[offset + j] = bytes[offset + j] ^ parseInt(keyHex.slice(j * 2, j * 2 + 2), 16);
      }
    }
    return out;
  }

  function encryptObject(obj, password, salt) {
    const raw = new TextEncoder().encode(JSON.stringify(obj));
    const enc = xorStream(raw, password, salt);
    let bin = "";
    for (let i = 0; i < enc.length; i++) bin += String.fromCharCode(enc[i]);
    return btoa(bin);
  }

  function decryptObject(b64, password, salt) {
    const bin = atob(b64);
    const enc = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) enc[i] = bin.charCodeAt(i);
    const raw = xorStream(enc, password, salt);
    return JSON.parse(new TextDecoder().decode(raw));
  }

  function buildEncryptedExportString(customKey) {
    const key = customKey ? customKey : BUILTIN_EXPORT_KEY;
    const salt = randomSalt();
    const secretPayload = {
      sig: currentSig,
      blocks: serializeBlocks(),
      favorites: Array.from(favorites)
    };
    const dataB64 = encryptObject(secretPayload, key, salt);
    const check = sha256(`${key}|${salt}|verify|${dataB64}`);
    return JSON.stringify({
      app: "BLiK-SIG",
      v: 1,
      salt,
      check,
      data: dataB64
    }, null, 2);
  }

  function parseEncryptedImportString(rawText, customKey) {
    let envelope;
    try {
      envelope = JSON.parse(rawText.trim());
    } catch (_) {
      throw new Error("Некоректний формат даних (очікується зашифрований JSON).");
    }

    if (!envelope || envelope.app !== "BLiK-SIG" || !envelope.salt || !envelope.check || !envelope.data) {
      throw new Error("Файл або текст не є зашифрованим пакетом БЛiК.");
    }

    const key = customKey ? customKey : BUILTIN_EXPORT_KEY;
    const expectedCheck = sha256(`${key}|${envelope.salt}|verify|${envelope.data}`);
    if (expectedCheck !== envelope.check) {
      throw new Error("Невірний ключ розшифрування або дані пошкоджено.");
    }

    let payload;
    try {
      payload = decryptObject(envelope.data, key, envelope.salt);
    } catch (_) {
      throw new Error("Помилка розшифрування пакета.");
    }

    if (!payload || typeof payload.sig !== "string" || !Array.isArray(payload.blocks)) {
      throw new Error("Пошкоджена структура даних усередині пакета.");
    }
    return payload;
  }

  function migrateFromV2(v2Blocks) {
    const catMap = {

    };
    const descMap = {
      "Стрелковое": "Стрілецьке",
      "Гранотомет": "Гранатомет",
      "Миномет": "Міномет",
      "Арта (*кол-во)": "Арта (*кількість)",
      "300 Важкийй": "300 Важкий",

      "Точка высадки / посадки": "Точка висадки / посадки",
      "Зробити рух ( вказати точку )": "Зробити рух (вказати точку)",
      "Знахожусь ( вказуем номер / назву точки )": "Знаходжусь (вказуємо номер / назву точки)",
      "Повернуться назад, стартове положення": "Повернутися назад, стартове положення"
    };

    const migrated = v2Blocks.map(b => ({
      ...b,
      category: catMap[b.category] || b.category,
      items: Array.isArray(b.items)
        ? b.items.map(it => ({
            ...it,

        : []
    }));

    const hasGeneral = migrated.some(b => b.category === "ЗАГАЛЬНЕ");
    if (!hasGeneral && migrated.length > 0) {
      const gen = BASE_DATA[0];
      migrated.unshift({
        id: uid(),
        category: gen.category,
        items: gen.items.map(it => ({ id: uid(), code: it.code, desc: it.desc })),
        lockHash: null,
        salt: null,
        encrypted: null
      });
    }
    return migrated;
  }

  function safeParse(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      if (raw === null) return fallback;
      const val = JSON.parse(raw);
      return val !== null ? val : fallback;
    } catch (_) {
      return fallback;
    }
  }

  function safeSave(key, val) {
    try {
      localStorage.setItem(key, typeof val === "string" ? val : JSON.stringify(val));
    } catch (_) {}
  }

  function safeRemove(key) {
    try {
      localStorage.removeItem(key);
    } catch (_) {}
  }

  let config = { ...DEFAULT_CONFIG, ...safeParse(KEYS.theme, {}) };
  let currentSig = DEFAULT_SIG;
  let blocks = [];
  const unlockedPasswords = new Map();
  let favorites = new Set();
  let collapsedCats = new Set(safeParse(KEYS.collapsed, []));
  let activeCategory = "ALL";
  let composerMode = false;
  let editMode = false;

  let currentMasterPassword = null;
  let currentMasterSalt = null;
  let currentMasterHash = null;

  function isAppProtected() {
    return Boolean(currentMasterHash && currentMasterSalt);
  }

  function isBlockProtected(block) {
    return Boolean(block.lockHash && block.salt);
  }

  function isBlockLocked(block) {
    return isBlockProtected(block) && !unlockedPasswords.has(block.id);
  }

  function serializeBlocks() {
    return blocks.map(b => {
      if (isBlockProtected(b)) {
        const pass = unlockedPasswords.get(b.id);
        return {
          id: b.id,
          category: b.category,
          items: [],
          lockHash: b.lockHash,
          salt: b.salt,
          encrypted: pass !== undefined ? encryptObject(b.items, pass, b.salt) : b.encrypted
        };
      }
      return {
        id: b.id,
        category: b.category,
        items: b.items,
        lockHash: null,
        salt: null,
        encrypted: null
      };
    });
  }

  function persistAppState() {
    const serialized = serializeBlocks();
    if (isAppProtected() && currentMasterPassword !== null) {
      const payload = encryptObject({
        sig: currentSig,
        blocks: serialized,
        favorites: Array.from(favorites)
      }, currentMasterPassword, currentMasterSalt);

      safeSave(KEYS.appLock, {
        hash: currentMasterHash,
        salt: currentMasterSalt,
        payload
      });
      safeRemove(KEYS.blocks);
      safeRemove(KEYS.sig);
      safeRemove(KEYS.favs);
    } else {
      safeSave(KEYS.blocks, serialized);
      safeSave(KEYS.sig, currentSig);
      safeSave(KEYS.favs, Array.from(favorites));
      safeRemove(KEYS.appLock);
    }
  }

  function hexToRgb(hex) {
    const clean = hex.replace("#", "");
    const num = parseInt(clean, 16);
    return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
  }

  function getLuminance(r, g, b) {
    return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  }

  function adjustBrightness(hex, factor) {
    const { r, g, b } = hexToRgb(hex);
    const clamp = v => Math.max(0, Math.min(255, Math.round(v)));
    return `rgb(${clamp(r + factor)}, ${clamp(g + factor)}, ${clamp(b + factor)})`;
  }

  function applyTheme(cfg) {
    const root = document.documentElement;
    const { r, g, b } = hexToRgb(cfg.bg);
    const isLight = getLuminance(r, g, b) > 0.55;

    root.style.setProperty("--bg-color", cfg.bg);
    root.style.setProperty("--accent-color", cfg.accent);
    root.style.setProperty("--depth", cfg.depth + "px");
    root.style.setProperty("--radius", cfg.radius + "px");
    root.style.setProperty("--font-size", cfg.fontSize + "px");

    if (isLight) {
      root.style.setProperty("--text-color", "#1f242d");
      root.style.setProperty("--text-muted", "#5b6475");
      root.style.setProperty("--shadow-light", adjustBrightness(cfg.bg, 24));
      root.style.setProperty("--shadow-dark", adjustBrightness(cfg.bg, -32));
      root.style.setProperty("--border-subtle", "rgba(0, 0, 0, 0.06)");
    } else {
      root.style.setProperty("--text-color", "#e4e8f0");
      root.style.setProperty("--text-muted", "#949db0");
      root.style.setProperty("--shadow-light", adjustBrightness(cfg.bg, 14));
      root.style.setProperty("--shadow-dark", adjustBrightness(cfg.bg, -18));
      root.style.setProperty("--border-subtle", "rgba(255, 255, 255, 0.05)");
    }

    document.getElementById("bgColorPicker").value = cfg.bg;
    document.getElementById("accentColorPicker").value = cfg.accent;
    document.getElementById("depthRange").value = cfg.depth;
    document.getElementById("depthVal").textContent = cfg.depth;
    document.getElementById("radiusRange").value = cfg.radius;
    document.getElementById("radiusVal").textContent = cfg.radius;
    document.getElementById("fontRange").value = cfg.fontSize;
    document.getElementById("fontVal").textContent = cfg.fontSize;

    safeSave(KEYS.theme, cfg);
  }

  // ==========================================
  // Копіювання, Toast, HTML
  // ==========================================
  function showToast(text) {
    const toast = document.getElementById("toast");
    toast.textContent = text;
    toast.classList.add("show");
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
  }

  function copyText(text, customMsg = null) {
    const ok = () => showToast(customMsg || `Скопійовано: ${text}`);
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(ok).catch(() => fallbackCopy(text, ok));
    } else {
      fallbackCopy(text, ok);
    }
  }

  function fallbackCopy(text, ok) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand("copy");
      ok();
    } catch (_) {
      showToast("Не вдалося скопіювати");
    }
    document.body.removeChild(ta);
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function highlight(text, query) {
    if (!query) return escapeHtml(text);
    const lowT = text.toLowerCase();
    const lowQ = query.toLowerCase();
    let res = "";
    let pos = 0;
    let idx = lowT.indexOf(lowQ, pos);
    while (idx !== -1) {
      res += escapeHtml(text.slice(pos, idx));
      res += `<mark class="hl">${escapeHtml(text.slice(idx, idx + lowQ.length))}</mark>`;
      pos = idx + lowQ.length;
      idx = lowT.indexOf(lowQ, pos);
    }
    res += escapeHtml(text.slice(pos));
    return res;
  }

  function tryUnlockApp() {
    const lockObj = safeParse(KEYS.appLock, null);
    if (!lockObj || !lockObj.hash || !lockObj.salt || !lockObj.payload) return;

    const inp = document.getElementById("appUnlockInput");
    const hint = document.getElementById("appUnlockHint");
    const pass = inp.value;

    if (sha256(`${lockObj.salt}:${pass}`) !== lockObj.hash) {
      hint.textContent = "✕ Невірний пароль";
      hint.className = "modal-hint err";
      inp.select();
      return;
    }

    let payload;
    try {
      payload = decryptObject(lockObj.payload, pass, lockObj.salt);
    } catch (_) {
      hint.textContent = "✕ Помилка розшифрування даних";
      hint.className = "modal-hint err";
      return;
    }

    currentMasterPassword = pass;
    currentMasterSalt = lockObj.salt;
    currentMasterHash = lockObj.hash;
    currentSig = typeof payload.sig === "string" ? payload.sig : DEFAULT_SIG;
    blocks = Array.isArray(payload.blocks) ? payload.blocks : makeDefaultBlocks();
    favorites = new Set(Array.isArray(payload.favorites) ? payload.favorites : []);

    document.getElementById("sigText").textContent = currentSig;
    document.getElementById("appLockScreen").classList.remove("open");
    document.getElementById("appContainer").style.display = "block";
    inp.value = "";
    hint.textContent = "";
    updateAppLockButtons();
    renderAll();
  }

    modalBody.appendChild(makePasswordField("pass1", "Новий пароль (введення 1)", "Придумайте пароль"));
    modalBody.appendChild(makePasswordField("pass2", "Повторіть пароль (введення 2)", "Введіть пароль ще раз"));

    modalHint.textContent = "Пароль вводиться 2 рази для уникнення помилок";
    modalHint.className = "modal-hint";

    modalActions.innerHTML = `
      <button type="button" class="neu-btn" id="mCancel">Скасувати</button>
      <button type="button" class="neu-btn success-btn" id="mSave">🔒 Встановити пароль</button>
    `;
    modalBackdrop.classList.add("open");

    const p1 = document.getElementById("pass1");
    const p2 = document.getElementById("pass2");
    const pCur = document.getElementById("passCur");
    (pCur || p1).focus();

    const checkMatch = () => {
      if (!p1.value && !p2.value) {
        modalHint.textContent = "Пароль вводиться 2 рази для уникнення помилок";
        modalHint.className = "modal-hint";
        return;
      }
      if (p1.value !== p2.value) {
        modalHint.textContent = "✕ Паролі не збігаються";
        modalHint.className = "modal-hint err";
      } else {
        modalHint.textContent = "✓ Паролі збігаються";
        modalHint.className = "modal-hint ok";
      }
    };

    p1.addEventListener("input", checkMatch);
    p2.addEventListener("input", checkMatch);

    const submit = () => {
      if (isChanging && sha256(`${block.salt}:${pCur.value}`) !== block.lockHash) {
        modalHint.textContent = "✕ Невірний поточний пароль";
        modalHint.className = "modal-hint err";
        return;
      }
      if (!p1.value) {
        modalHint.textContent = "✕ Пароль не може бути порожнім";
        modalHint.className = "modal-hint err";
        return;
      }
      if (p1.value !== p2.value) {
        modalHint.textContent = "✕ Паролі не збігаються — перевірте введення";
        modalHint.className = "modal-hint err";
        return;
      }

      const salt = randomSalt();
      block.salt = salt;
      block.lockHash = sha256(`${salt}:${p1.value}`);
      unlockedPasswords.set(block.id, p1.value);
      persistAppState();
      renderAll();
      closeModal();
      showToast(`Пароль встановлено на блок «${block.category}»`);
    };

    document.getElementById("mCancel").onclick = closeModal;
    document.getElementById("mSave").onclick = submit;
    p2.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
  }

  function openUnlockModal(block, afterUnlock = null) {
    modalTitle.textContent = `🔓 Розблокувати блок «${block.category}»`;
    modalBody.innerHTML = "";
    modalBody.appendChild(makePasswordField("unlockPass", "Пароль", "Введіть пароль блоку"));
    modalHint.textContent = "";
    modalActions.innerHTML = `
      <button type="button" class="neu-btn" id="mCancel">Скасувати</button>
      <button type="button" class="neu-btn success-btn" id="mUnlock">Відкрити</button>
    `;
    modalBackdrop.classList.add("open");

    const inp = document.getElementById("unlockPass");
    inp.focus();

    const submit = () => {
      const pass = inp.value;
      if (sha256(`${block.salt}:${pass}`) !== block.lockHash) {
        modalHint.textContent = "✕ Невірний пароль";
        modalHint.className = "modal-hint err";
        inp.select();
        return;
      }
      try {
        block.items = block.encrypted ? decryptObject(block.encrypted, pass, block.salt) : [];
      } catch (_) {
        modalHint.textContent = "✕ Помилка розшифрування даних";
        modalHint.className = "modal-hint err";
        return;
      }
      unlockedPasswords.set(block.id, pass);
      closeModal();
      renderAll();
      showToast(`Блок «${block.category}» розблоковано`);
      if (afterUnlock) afterUnlock();
    };

    document.getElementById("mCancel").onclick = closeModal;
    document.getElementById("mUnlock").onclick = submit;
    inp.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
  }

    modalBody.innerHTML = "";
    modalBody.appendChild(makePasswordField("remPass", "Поточний пароль", "Підтвердіть поточним паролем"));

      <button type="button" class="neu-btn" id="mCancel">Скасувати</button>
      <button type="button" class="neu-btn danger-btn" id="mConfirm">Зняти захист</button>
    `;
    modalBackdrop.classList.add("open");

    const inp = document.getElementById("remPass");
    inp.focus();

    const submit = () => {
      if (sha256(`${block.salt}:${inp.value}`) !== block.lockHash) {
        modalHint.textContent = "✕ Невірний пароль";

  function lockBlockNow(block) {
    if (!isBlockProtected(block)) return;
    const pass = unlockedPasswords.get(block.id);
    if (pass !== undefined) {
      block.encrypted = encryptObject(block.items, pass, block.salt);
    }
    unlockedPasswords.delete(block.id);
    block.items = [];
    persistAppState();
    renderAll();
    showToast(`Блок «${block.category}» заблоковано`);
  }

  function applyImportedPayload(payload) {
    currentSig = payload.sig;
    document.getElementById("sigText").textContent = currentSig;

    blocks = payload.blocks;
    unlockedPasswords.clear();

    favorites = new Set(Array.isArray(payload.favorites) ? payload.favorites : []);
    activeCategory = "ALL";
    collapsedCats.clear();
    safeSave(KEYS.collapsed, []);

    persistAppState();

  function openImportModal() {
    modalTitle.textContent = "📂 Імпорт (Файл і Буфер обміну)";
    modalBody.innerHTML = `
      <div class="modal-note neu-pressed">
        Завантажує <strong>тільки заголовок (СИГНАЛ) і сигнали</strong>. Поточна тема оформлення та налаштування інтерфейсу залишаться без змін.
      </div>
    `;
    modalBody.appendChild(
      makePasswordField("impKeyInput", "Ключ розшифрування (необов'язково)", "Порожньо = використовується вбудований ключ")
    );

    const pasteWrap = document.createElement("div");
    pasteWrap.className = "modal-field";
    pasteWrap.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
        <label for="impPasteBox">Дані з буфера обміну або файлу</label>
        <button type="button" class="neu-btn" id="mPasteFromClip" style="padding:4px 9px; font-size:0.78em;">📋 Вставити з буфера</button>
      </div>
      <textarea id="impPasteBox" class="modal-input neu-pressed" rows="4" placeholder='Вставте зашифрований JSON-текст або виберіть .json файл нижче...'></textarea>
    `;
    modalBody.appendChild(pasteWrap);

    modalHint.textContent = "";
    modalActions.innerHTML = `
      <button type="button" class="neu-btn" id="mCancel">Скасувати</button>
      <button type="button" class="neu-btn" id="mPickFile">📂 Вибрати файл .json</button>
      <button type="button" class="neu-btn success-btn" id="mRunImport">✓ Імпортувати</button>
    `;
    modalBackdrop.classList.add("open");

    const keyInp = document.getElementById("impKeyInput");
    const pasteBox = document.getElementById("impPasteBox");

    const tryImportText = raw => {
      if (!raw.trim()) {
        modalHint.textContent = "✕ Вставте текст із буфера або виберіть .json файл";
        modalHint.className = "modal-hint err";
        return;
      }
      try {
        const payload = parseEncryptedImportString(raw, keyInp.value);
        applyImportedPayload(payload);
        closeModal();
        showToast("Заголовок і сигнали успішно імпортовано!");
      } catch (err) {
        pasteBox.value = raw;
        modalHint.textContent = "✕ " + err.message;
        modalHint.className = "modal-hint err";
      }
    };

    document.getElementById("mCancel").onclick = closeModal;
    document.getElementById("mRunImport").onclick = () => tryImportText(pasteBox.value);

    document.getElementById("mPasteFromClip").onclick = async () => {
      if (navigator.clipboard && navigator.clipboard.readText) {
        try {
          const clipText = await navigator.clipboard.readText();
          if (clipText) {
            pasteBox.value = clipText;
            modalHint.textContent = "✓ Текст вставлено. Натисніть «Імпортувати» (або введіть ключ).";
            modalHint.className = "modal-hint ok";
            return;
          }
        } catch (_) {}
      }
      pasteBox.focus();
      modalHint.textContent = "Вставте текст вручну (Ctrl+V / Довге натискання → Вставити)";
      modalHint.className = "modal-hint";
    };

    const fileInput = document.getElementById("importFileInput");
    fileInput.onchange = e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => tryImportText(String(ev.target.result || ""));
      reader.readAsText(file);
      e.target.value = "";
    };

    document.getElementById("mPickFile").onclick = () => fileInput.click();
  }

  function getVisibleBlocksForAllToggle() {
    return blocks.filter(b => activeCategory === "ALL" || activeCategory === "FAV" || b.id === activeCategory);
  }

  function updateToggleAllBtn() {
    const btn = document.getElementById("toggleAllBlocksBtn");
    const targetBlocks = getVisibleBlocksForAllToggle();
    if (targetBlocks.length === 0) {
      btn.style.display = "none";
      return;
    }
    btn.style.display = "inline-flex";
    const allCollapsed = targetBlocks.every(b => collapsedCats.has(b.id));
    btn.textContent = allCollapsed ? "➕ Розгорнути всі" : "➖ Згорнути всі";
    btn.classList.toggle("active", allCollapsed);
  }

  function renderCategoryPills() {
    const pillsEl = document.getElementById("catPills");
    const totalCount = blocks.reduce((sum, b) => sum + (isBlockLocked(b) ? 0 : b.items.length), 0);

    let html = `<button type="button" class="neu-btn pill-btn ${activeCategory === "ALL" ? "active" : ""}" data-cat="ALL">🌐 Усі (${totalCount})</button>`;
    html += `<button type="button" class="neu-btn pill-btn fav-pill ${activeCategory === "FAV" ? "active" : ""}" data-cat="FAV">★ Обране (${favorites.size})</button>`;

    blocks.forEach(b => {
      const lockMark = isBlockLocked(b) ? "🔒 " : (isBlockProtected(b) ? "🔓 " : "");
      html += `<button type="button" class="neu-btn pill-btn ${activeCategory === b.id ? "active" : ""}" data-cat="${b.id}">${lockMark}${escapeHtml(b.category)}</button>`;
    });

    pillsEl.innerHTML = html;
  }

  function renderGrid() {
    const grid = document.getElementById("categoriesGrid");
    const rawQuery = document.getElementById("searchInput").value.trim();
    const q = rawQuery.toLowerCase();
    document.getElementById("searchClearBtn").classList.toggle("visible", rawQuery.length > 0);

    grid.innerHTML = "";

    if (blocks.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty-state neu-extruded";
      empty.innerHTML = `
        <div style="font-size:1.1em; font-weight:700; color:var(--text-color);">Список сигналів повністю порожній</div>
        <div>Створіть свій перший блок або імпортуйте зашифровану таблицю.</div>
        <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center;">
          <button type="button" class="neu-btn success-btn" id="emptyNewBlock">➕ Створити перший блок</button>
          <button type="button" class="neu-btn" id="emptyImport">📂 Імпорт</button>
          <button type="button" class="neu-btn" id="emptyRestore">↺ Повернути базові сигнали</button>
        </div>
      `;
      empty.querySelector("#emptyNewBlock").onclick = () => openBlockModal(null);
      empty.querySelector("#emptyImport").onclick = openImportModal;
      empty.querySelector("#emptyRestore").onclick = restoreDefaultBlocks;
      grid.appendChild(empty);
      updateToggleAllBtn();
      return;
    }

    let renderedCards = 0;

    blocks.forEach(block => {
      if (activeCategory !== "ALL" && activeCategory !== "FAV" && block.id !== activeCategory) {
        return;
      }

      const locked = isBlockLocked(block);
      const protectedBlock = isBlockProtected(block);

      if (locked) {
        if (q && !block.category.toLowerCase().includes(q)) return;
        if (activeCategory === "FAV") return;
      }

      const filteredItems = locked ? [] : block.items.filter(item => {
        if (activeCategory === "FAV" && !favorites.has(item.id)) return false;
        if (!q) return true;
        return (
          block.category.toLowerCase().includes(q) ||
          item.code.toLowerCase().includes(q) ||
          item.desc.toLowerCase().includes(q)
        );
      });

      if (!locked && (q || activeCategory === "FAV") && filteredItems.length === 0) {
        return;
      }

      renderedCards++;
      const card = document.createElement("div");
      const isCollapsed = !q && collapsedCats.has(block.id);
      card.className = "category-card neu-extruded" + (isCollapsed ? " collapsed" : "");

      const header = document.createElement("div");
      header.className = "category-header";

      const lockBtnClass = locked
        ? "icon-btn lock-active"
        : (protectedBlock ? "icon-btn unlock-active" : "icon-btn edit-only");
      const lockIcon = locked ? "🔒" : (protectedBlock ? "🔓" : "🔒");
      const lockTitle = locked
        ? "Розблокувати блок"
        : (protectedBlock ? "Керування паролем / заблокувати" : "Захистити блок паролем");

      header.innerHTML = `
        <div class="category-title-click">
          <span class="category-title">${highlight(block.category, rawQuery)}</span>
          <span class="category-count neu-pressed">${locked ? "🔒" : filteredItems.length}</span>
        </div>
        <div class="cat-header-controls">
          <button type="button" class="${lockBtnClass}" data-act="lock" title="${lockTitle}">${lockIcon}</button>
          <button type="button" class="icon-btn edit-only" data-act="add" title="Додати сигнал у цей блок">⊕</button>
          <button type="button" class="icon-btn edit-only" data-act="rename" title="Перейменувати блок">✎</button>
          <button type="button" class="icon-btn del edit-only" data-act="del-block" title="Видалити весь блок">🗑️</button>
          <button type="button" class="toggle-block-btn" data-act="toggle" title="${isCollapsed ? "Розгорнути блок" : "Згорнути блок"}">${isCollapsed ? "➕" : "➖"}</button>
        </div>
      `;

      header.querySelector(".category-title-click").addEventListener("click", () => toggleCollapse(block.id, card));
      header.querySelector('[data-act="toggle"]').addEventListener("click", () => toggleCollapse(block.id, card));

      header.querySelector('[data-act="lock"]').addEventListener("click", () => {
        if (locked) openUnlockModal(block);
        else if (protectedBlock) openManageLockModal(block);
        else openSetPasswordModal(block, false);
      });

      header.querySelector('[data-act="add"]').addEventListener("click", () => {
        if (locked) openUnlockModal(block, () => openSignalModal(block.id, null));
        else openSignalModal(block.id, null);
      });

      header.querySelector('[data-act="rename"]').addEventListener("click", () => {
        if (locked) openUnlockModal(block, () => openBlockModal(block));
        else openBlockModal(block);
      });

      header.querySelector('[data-act="del-block"]').addEventListener("click", () => {
        const doDelete = () => {
          openConfirmModal(
            "🗑️ Видалити блок?",
            `Ви справді хочете видалити блок «${block.category}» та всі його сигнали?`,
            "Видалити блок",
            () => {
              blocks = blocks.filter(b => b.id !== block.id);
              unlockedPasswords.delete(block.id);
              collapsedCats.delete(block.id);
              safeSave(KEYS.collapsed, Array.from(collapsedCats));
              if (activeCategory === block.id) activeCategory = "ALL";
              persistAppState();
              renderAll();
              showToast(`Блок «${block.category}» видалено`);
            }
          );
        };
        if (locked) openUnlockModal(block, doDelete);
        else doDelete();
      });

      const body = document.createElement("div");
      body.className = "category-body";

      if (locked) {
        body.innerHTML = `
          <div class="locked-box neu-pressed">
            <div class="lock-big">🔒</div>
            <div style="font-weight:600; color:var(--text-color);">Блок захищено паролем</div>
            <div style="font-size:0.85em;">Вміст приховано і зашифровано</div>
            <button type="button" class="neu-btn success-btn">🔑 Ввести пароль</button>
          </div>
        `;
        body.querySelector("button").addEventListener("click", () => openUnlockModal(block));
      } else if (filteredItems.length === 0) {
        body.innerHTML = `
          <div class="locked-box neu-pressed" style="padding:16px;">
            <div style="font-size:0.9em;">У цьому блоці поки немає сигналів</div>
            <button type="button" class="neu-btn">⊕ Додати перший сигнал</button>
          </div>
        `;
        body.querySelector("button").addEventListener("click", () => openSignalModal(block.id, null));
      } else {
        const table = document.createElement("table");
        const tbody = document.createElement("tbody");

        filteredItems.forEach(item => {
          const isFav = favorites.has(item.id);
          const tr = document.createElement("tr");
          tr.className = "code-row row-bg";
          tr.title = composerMode ? "Додати в рядок набору" : "Натисніть, щоб скопіювати";

          tr.innerHTML = `
            <td class="code-cell">${highlight(item.code, rawQuery)}</td>
            <td class="desc-cell"><span class="desc-text">${highlight(item.desc, rawQuery)}</span></td>
            <td class="actions-cell">
              <button type="button" class="row-action-btn ${isFav ? "is-fav" : ""}" data-act="fav" title="В обране">${isFav ? "★" : "☆"}</button>
              <button type="button" class="row-action-btn edit-row-btn edit-only" data-act="edit-item" title="Редагувати">✎</button>
              <button type="button" class="row-action-btn del-row-btn edit-only" data-act="del-item" title="Видалити сигнал">🗑️</button>
            </td>
          `;

          tr.addEventListener("click", e => {
            const actBtn = e.target.closest("[data-act]");
            if (actBtn) {
              const act = actBtn.dataset.act;
              if (act === "fav") {
                if (favorites.has(item.id)) favorites.delete(item.id);
                else favorites.add(item.id);
                persistAppState();
                renderAll();
              } else if (act === "edit-item") {
                openSignalModal(block.id, item);
              } else if (act === "del-item") {
                block.items = block.items.filter(x => x.id !== item.id);
                favorites.delete(item.id);
                persistAppState();
                renderAll();
                showToast(`Сигнал «${item.code}» видалено`);
              }
              return;
            }

            if (document.body.classList.contains("hide-descs")) {
              tr.classList.toggle("revealed");
            }

            const payload = copyCodeOnly ? item.code : `${item.code} — ${item.desc}`;
            if (composerMode) {
              const comp = document.getElementById("composerInput");
              comp.value = comp.value ? `${comp.value} | ${item.code}` : item.code;
              comp.focus();
              showToast(`Додано: ${item.code}`);
            } else {
              copyText(payload);
            }
          });

          tbody.appendChild(tr);
        });

        table.appendChild(tbody);
        body.appendChild(table);
      }

      card.appendChild(header);
      card.appendChild(body);
      grid.appendChild(card);
    });

    if (renderedCards === 0) {
      const empty = document.createElement("div");
      empty.className = "empty-state neu-extruded";
      empty.textContent = activeCategory === "FAV" && !rawQuery
        ? "Список обраного порожній — натисніть ☆ на будь-якому рядку, щоб закріпити його тут."
        : "Нічого не знайдено за вашим запитом.";
      grid.appendChild(empty);
    }

    updateToggleAllBtn();
  }

  function toggleCollapse(blockId, card) {
    const collapsed = !collapsedCats.has(blockId);
    if (collapsed) collapsedCats.add(blockId);
    else collapsedCats.delete(blockId);
    safeSave(KEYS.collapsed, Array.from(collapsedCats));
    card.classList.toggle("collapsed", collapsed);
    const btn = card.querySelector(".toggle-block-btn");
    if (btn) {
      btn.textContent = collapsed ? "➕" : "➖";
      btn.title = collapsed ? "Розгорнути блок" : "Згорнути блок";
    }
    updateToggleAllBtn();
  }

  function renderAll() {
    renderCategoryPills();
    renderGrid();
  }

  function restoreDefaultBlocks() {
    openConfirmModal(
      "↺ Відновити стандартні сигнали?",
      "Поточні блоки буде замінено на початкові 9 блоків (ЗАГАЛЬНЕ, ОБСТРІЛ, НАСТУП, ПОРАНЕНИЙ тощо).",
      "Відновити",
      () => {
        blocks = makeDefaultBlocks();
        unlockedPasswords.clear();
        favorites.clear();
        collapsedCats.clear();
        activeCategory = "ALL";
        safeSave(KEYS.collapsed, []);
        persistAppState();
        renderAll();
        showToast("Базові сигнали відновлено");
      }
    );
  }

  // ==========================================
  // Тренажер (Квіз — без підказок категорій)
  // ==========================================
  let quizTotal = 0;
  let quizCorrect = 0;
  let quizStreak = 0;
  let quizAnswered = false;

  function loadNextQuestion() {
    const allItems = blocks
      .filter(b => !isBlockLocked(b))
      .flatMap(b => b.items);

    const qEl = document.getElementById("quizQuestion");
    const optsEl = document.getElementById("quizOptions");

    if (allItems.length < 4) {
      qEl.textContent = "Для тесту потрібно щонайменше 4 відкритих сигнали";
      optsEl.innerHTML = "";
      return;
    }

    quizAnswered = false;
    const target = allItems[Math.floor(Math.random() * allItems.length)];
    const askByCode = Math.random() > 0.35;

    const pool = allItems.filter(it => it.code !== target.code && it.desc !== target.desc);
    const distractors = [];
    while (distractors.length < 3 && pool.length > 0) {
      const idx = Math.floor(Math.random() * pool.length);
      distractors.push(pool.splice(idx, 1)[0]);
    }

    const choices = [target, ...distractors].sort(() => Math.random() - 0.5);
    qEl.innerHTML = askByCode
      ? `Що означає: <span>${escapeHtml(target.code)}</span>?`
      : `Який код означає: <span>${escapeHtml(target.desc)}</span>?`;

    optsEl.innerHTML = "";
    choices.forEach(ch => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "neu-btn quiz-opt";
      btn.textContent = askByCode ? ch.desc : ch.code;
      btn.addEventListener("click", () => {
        if (quizAnswered) return;
        quizAnswered = true;
        quizTotal++;
        const isRight = ch.code === target.code && ch.desc === target.desc;
        if (isRight) {
          quizCorrect++;
          quizStreak++;
          btn.classList.add("correct");
        } else {
          quizStreak = 0;
          btn.classList.add("wrong");
          Array.from(optsEl.children).forEach(b => {
            if (b.textContent === (askByCode ? target.desc : target.code)) {
              b.classList.add("correct");
            }
          });
        }
        document.getElementById("quizScore").textContent = `Вірно: ${quizCorrect} / ${quizTotal} | Серія: ${quizStreak}`;
      });
      optsEl.appendChild(btn);
    });
  }

  // ==========================================
  // Події екрана блокування застосунку
  // ==========================================
  document.getElementById("appUnlockEye").addEventListener("click", () => {
    const inp = document.getElementById("appUnlockInput");
    inp.type = inp.type === "password" ? "text" : "password";
    inp.focus();
  });

  document.getElementById("appUnlockSubmit").addEventListener("click", tryUnlockApp);
  document.getElementById("appUnlockInput").addEventListener("keydown", e => {
    if (e.key === "Enter") tryUnlockApp();
  });

  document.getElementById("appLockResetBtn").addEventListener("click", () => {
    openConfirmModal(
      "🗑️ Скинути пароль і дані?",
      "Усі збережені та зашифровані сигнали буде видалено, а пароль застосунку — скинуто.",
      "Скинути все",
      () => {
        safeRemove(KEYS.appLock);
        safeRemove(KEYS.blocks);
        safeRemove(KEYS.blocksLegacyV2);
        safeRemove(KEYS.sig);
        safeRemove(KEYS.favs);
        safeRemove(KEYS.collapsed);
        currentMasterPassword = null;
        currentMasterSalt = null;
        currentMasterHash = null;
        currentSig = DEFAULT_SIG;
        blocks = makeDefaultBlocks();
        favorites = new Set();
        collapsedCats = new Set();
        persistAppState();
        document.getElementById("sigText").textContent = currentSig;
        document.getElementById("appLockScreen").classList.remove("open");
        document.getElementById("appContainer").style.display = "block";
        updateAppLockButtons();
        renderAll();
        showToast("Пароль скинуто, завантажено базові сигнали");
      }
    );
  });

  // ==========================================
  // Події основного інтерфейсу
  // ==========================================
  document.getElementById("appKeyBtn").addEventListener("click", () => {
    if (isAppProtected()) openManageAppPasswordModal();
    else openSetAppPasswordModal(false);
  });

  document.getElementById("appQuickLockBtn").addEventListener("click", lockEntireApp);
  document.getElementById("sigBadge").addEventListener("click", openEditSigModal);

  document.getElementById("editModeBtn").addEventListener("click", e => {
    editMode = !editMode;
    document.body.classList.toggle("edit-mode", editMode);
    document.getElementById("editorToolbar").classList.toggle("open", editMode);
    e.currentTarget.classList.toggle("active", editMode);
  });

  document.getElementById("btnNewBlock").addEventListener("click", () => openBlockModal(null));
  document.getElementById("btnNewSignal").addEventListener("click", () => openSignalModal(null, null));
  document.getElementById("btnEdExport").addEventListener("click", openExportModal);
  document.getElementById("btnEdImport").addEventListener("click", openImportModal);

  document.getElementById("btnLockAll").addEventListener("click", () => {
    let count = 0;
    blocks.forEach(b => {
      if (isBlockProtected(b) && unlockedPasswords.has(b.id)) {
        lockBlockNow(b);
        count++;
      }
    });
    if (count === 0) showToast("Немає відкритих запаролених блоків");
  });

  document.getElementById("btnClearAll").addEventListener("click", () => {
    openConfirmModal(
      "🗑️ Очистити всі сигнали?",
      "Усі блоки та всі сигнали (включно із захищеними) буде повністю видалено, щоб ви могли створити свою таблицю з нуля.",
      "Очистити все",
      () => {
        blocks = [];
        unlockedPasswords.clear();
        favorites.clear();
        collapsedCats.clear();
        activeCategory = "ALL";
        safeSave(KEYS.collapsed, []);
        persistAppState();
        renderAll();
        showToast("Усі сигнали очищено");
      }
    );
  });

  document.getElementById("btnRestoreDefaults").addEventListener("click", restoreDefaultBlocks);

  document.getElementById("catPills").addEventListener("click", e => {
    const btn = e.target.closest("[data-cat]");
    if (!btn) return;
    activeCategory = btn.dataset.cat;
    renderAll();
  });

  document.getElementById("toggleAllBlocksBtn").addEventListener("click", () => {
    const targetBlocks = getVisibleBlocksForAllToggle();
    if (targetBlocks.length === 0) return;
    const allCollapsed = targetBlocks.every(b => collapsedCats.has(b.id));
    if (allCollapsed) {
      targetBlocks.forEach(b => collapsedCats.delete(b.id));
    } else {
      targetBlocks.forEach(b => collapsedCats.add(b.id));
    }
    safeSave(KEYS.collapsed, Array.from(collapsedCats));
    renderGrid();
  });

  document.getElementById("searchInput").addEventListener("input", renderGrid);
  document.getElementById("searchClearBtn").addEventListener("click", () => {
    const inp = document.getElementById("searchInput");
    inp.value = "";
    renderGrid();
    inp.focus();
  });

  document.getElementById("settingsToggleBtn").addEventListener("click", e => {
    document.getElementById("settingsPanel").classList.toggle("open");
    e.currentTarget.classList.toggle("active");
  });

  document.getElementById("composerToggleBtn").addEventListener("click", e => {
    composerMode = !composerMode;
    document.getElementById("composerPanel").classList.toggle("open", composerMode);
    e.currentTarget.classList.toggle("active", composerMode);
    if (composerMode) document.getElementById("composerInput").focus();
  });

  document.getElementById("copyComposerBtn").addEventListener("click", () => {
    const val = document.getElementById("composerInput").value.trim();
    if (val) copyText(val);
  });

  document.getElementById("clearComposerBtn").addEventListener("click", () => {
    document.getElementById("composerInput").value = "";
  });

  document.getElementById("quizToggleBtn").addEventListener("click", e => {
    const panel = document.getElementById("quizPanel");
    const open = panel.classList.toggle("open");
    e.currentTarget.classList.toggle("active", open);
    if (open) loadNextQuestion();
  });
  document.getElementById("quizNextBtn").addEventListener("click", loadNextQuestion);

  document.getElementById("hideDescsBtn").addEventListener("click", e => {
    const hidden = document.body.classList.toggle("hide-descs");
    e.currentTarget.classList.toggle("active", hidden);
    e.currentTarget.textContent = hidden ? "👁️ Показати значення" : "👁️ Приховати значення";
  });

  function updateCopyModeBtn() {
    document.getElementById("copyModeBtn").textContent = copyCodeOnly
      ? "🏷️ Копіювати: Тільки код"
      : "📋 Копіювати: Код — значення";
  }

  document.getElementById("copyModeBtn").addEventListener("click", () => {
    copyCodeOnly = !copyCodeOnly;
    safeSave(KEYS.copyMode, copyCodeOnly ? "code" : "both");
    updateCopyModeBtn();
    showToast(copyCodeOnly ? "Режим: копіюється тільки код" : "Режим: код і значення");
  });

  document.getElementById("exportJsonBtn").addEventListener("click", openExportModal);
  document.getElementById("importJsonBtn").addEventListener("click", openImportModal);

  // Налаштування теми
  document.getElementById("themeModeBtn").addEventListener("click", () => {
    const { r, g, b } = hexToRgb(config.bg);
    const isLight = getLuminance(r, g, b) > 0.55;
    config.bg = isLight ? "#1e2024" : "#e4e8ef";
    config.accent = isLight ? "#3b82f6" : "#2563eb";
    applyTheme(config);
  });

  document.querySelectorAll(".preset-dot").forEach(dot => {
    dot.addEventListener("click", () => {
      config.bg = dot.dataset.bg;
      config.accent = dot.dataset.accent;
      applyTheme(config);
    });
  });

  document.getElementById("bgColorPicker").addEventListener("input", e => { config.bg = e.target.value; applyTheme(config); });
  document.getElementById("accentColorPicker").addEventListener("input", e => { config.accent = e.target.value; applyTheme(config); });
  document.getElementById("depthRange").addEventListener("input", e => { config.depth = Number(e.target.value); applyTheme(config); });
  document.getElementById("radiusRange").addEventListener("input", e => { config.radius = Number(e.target.value); applyTheme(config); });
  document.getElementById("fontRange").addEventListener("input", e => { config.fontSize = Number(e.target.value); applyTheme(config); });
  document.getElementById("resetSettingsBtn").addEventListener("click", () => {
    config = { ...DEFAULT_CONFIG };
    applyTheme(config);
    showToast("Тему скинуто");
  });

  // Гарячі клавіші
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && modalBackdrop.classList.contains("open")) {
      closeModal();
      return;
    }
    if (document.getElementById("appContainer").style.display === "none") return;

    const search = document.getElementById("searchInput");
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
      e.preventDefault();
      search.focus();
      search.select();
    } else if (e.key === "/" && !["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) {
      e.preventDefault();
      search.focus();
    } else if (e.key === "Escape" && search.value.length > 0) {
      search.value = "";
      renderGrid();
    }
  });

  // Ініціалізація застосунку
  (function initApp() {
    applyTheme(config);
    updateCopyModeBtn();

    const lockObj = safeParse(KEYS.appLock, null);
    if (lockObj && lockObj.hash && lockObj.salt && lockObj.payload) {
      currentMasterHash = lockObj.hash;
      currentMasterSalt = lockObj.salt;
      document.getElementById("appContainer").style.display = "none";
      document.getElementById("appLockScreen").classList.add("open");
      document.getElementById("appUnlockInput").focus();
      return;
    }

    const savedSig = localStorage.getItem(KEYS.sig);
    currentSig = savedSig || DEFAULT_SIG;
    document.getElementById("sigText").textContent = currentSig;

    const savedBlocksV3 = safeParse(KEYS.blocks, null);
    if (Array.isArray(savedBlocksV3)) {
      blocks = savedBlocksV3;
    } else {
      const legacyV2 = safeParse(KEYS.blocksLegacyV2, null);
      if (Array.isArray(legacyV2)) {
        blocks = migrateFromV2(legacyV2);
      } else {
        blocks = makeDefaultBlocks();
      }
      safeSave(KEYS.blocks, blocks);
    }

    favorites = new Set(safeParse(KEYS.favs, []));
    document.getElementById("appContainer").style.display = "block";
    updateAppLockButtons();
    renderAll();
  })();
</script>
</body>
</html>
